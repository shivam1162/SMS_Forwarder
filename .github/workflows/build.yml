name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/SMS_Forwarder.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SMS Forwarder v1.0.${{ github.run_number }}"
          body: "Automated build #${{ github.run_number }} for commit ${{ github.sha }}"
          files: release_assets/SMS_Forwarder.apk
          draft: false
          prerelease: false

      - name: Update Firebase App Version
        run: |
          curl -X PUT \
            -H "Content-Type: application/json" \
            -d '{"versionCode": '${{ github.run_number }}', "versionName": "1.0.'${{ github.run_number }}'", "downloadUrl": "https://github.com/shivam1162/SMS_Forwarder/releases/download/v1.0.'${{ github.run_number }}'/SMS_Forwarder.apk", "releaseNotes": "Update #${{ github.run_number }} with latest improvements"}' \
            "https://msgforwarder-a6c00-default-rtdb.firebaseio.com/app_update.json"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-debug
          path: release_assets/SMS_Forwarder.apk
